---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd                                # Namespace in which ArgoCD is deployed
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 34.1.1
    path: cluster/prometheus
    helm:
      values: |
        fullnameOverride: prometheus
        prometheus:
          prometheusSpec:
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retension: 2d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 600Gi     # Size of volume used by prometheus'. Can be modified depending on  required retention
        grafana:
          # Decommissioned 2026-09-01: Grafana 8.4.2 (chart 34.1.1) was flagged by
          # attack-surface monitoring for ~23 CVEs while exposed at
          # monitoring.biosimulations.org. Its only datasources (Loki, Tempo) no
          # longer exist in this cluster, so the UI had nothing left to render.
          # Re-enabling requires a supported Grafana release, not this chart version.
          enabled: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true